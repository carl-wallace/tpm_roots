[package]
name = "tpm_roots"
version = "0.1.2"
edition = "2021"
# Follows certval's MSRV: the material now arrives through certval_stores_tpm, and certval is what
# sets the floor for everything in that chain.
rust-version = "1.88"

[dependencies]
# The material. `default-features = false` keeps `reqwest-client` off: nothing here fetches, and the
# HTTP stack is compiled by everyone who depends on a provider crate.
certval_stores_core = { version = "0.1.0-rc.1", default-features = false }
certval_stores_tpm = { version = "1.0.0-rc.1", default-features = false, features = ["tpm"] }

# `default-features = false` drops `remote`, and with it reqwest and the url -> idna -> icu
# stack. Nothing here fetches: the material arrives through certval_stores_tpm.
certval = { version = "0.2.0-rc.1", default-features = false, features = ["std", "rsa"] }
x509-cert = "0.3.0"

log = "0.4.33"

[dev-dependencies]
certval = { version = "0.2.0-rc.1", default-features = false, features = ["std", "rsa"] }
