[package]
name = "tpm_roots"
version = "0.1.1"
edition = "2021"
rust-version = "1.80.1"

[dependencies]
base64ct = { version="1.8.0", features = ["alloc"] }
pem-rfc7468 = { version="1.0.0-rc.3", features = ["alloc"]}
x509-cert = "0.3.0-rc.0"

certval = { git = "https://github.com/carl-wallace/rust-pki.git", features = ["std", "rsa"], branch = "cert_limbo"}

sha2 = "0.11.0-rc.0"

cab = "0.6.0"
log = "0.4.27"
reqwest = "0.12.20"
tokio = { version = "1.45.1", features = ["full", "time", "rt-multi-thread"]}

[dev-dependencies]
base64ct = { version="1.8.0", features = ["alloc"] }
der = { version = "0.8.0-rc.4", features = ["alloc", "derive", "oid", "pem"] }
pem-rfc7468 = { version="1.0.0-rc.3", features = ["alloc"]}
x509-cert = { version = "0.3.0-rc.0", features = ["hazmat"] }

certval = { git = "https://github.com/carl-wallace/rust-pki.git", features = ["std", "rsa"], branch = "cert_limbo"}
tpm_cab_verify = {git = "https://github.com/carl-wallace/tpm_cab_verify.git", branch = "updates"}

rsa = "0.10.0-rc.0"
sha1 = "0.11.0-rc.0"
sha2 = "0.11.0-rc.0"

cab = "0.6.0"
log4rs = "1.3.0"
reqwest = "0.12.20"
tokio = { version = "1.45.1", features = ["full", "time", "rt-multi-thread"]}
walkdir = "2.5.0"

[build-dependencies]
base64ct = { version="1.8.0", features = ["alloc"] }
der = { version = "0.8.0-rc.6", features = ["alloc", "derive", "oid", "pem"] }
pem-rfc7468 = { version="1.0.0-rc.3", features = ["alloc"]}
x509-cert = "0.3.0-rc.0"

certval = { git = "https://github.com/carl-wallace/rust-pki.git", features = ["std", "rsa"], branch = "cert_limbo"}
tpm_cab_verify = {git = "https://github.com/carl-wallace/tpm_cab_verify.git", branch = "updates"}

rsa = { version = "0.10.0-rc.1", features = ["pkcs5", "encoding"] }
sha1 = { version = "0.11.0-rc.0", features = ["oid"] }
sha2 = "0.11.0-rc.0"

cab = "0.6.0"
reqwest = "0.12.20"
tokio = { version = "1.45.1", features = ["full", "time", "rt-multi-thread"]}

[features]
unverified_amd_roots = []
sha1_certs = []

[patch.crates-io]
# RustCrypto repos
primefield = { git = "https://github.com/RustCrypto/elliptic-curves.git" }
p256       = { git = "https://github.com/RustCrypto/elliptic-curves.git" }
p384       = { git = "https://github.com/RustCrypto/elliptic-curves.git" }
p521       = { git = "https://github.com/RustCrypto/elliptic-curves.git" }

cmpv2      = { git = "https://github.com/RustCrypto/formats.git" }
cms        = { git = "https://github.com/RustCrypto/formats.git" }
crmf       = { git = "https://github.com/RustCrypto/formats.git" }
der        = { git = "https://github.com/RustCrypto/formats.git" }
der_derive = { git = "https://github.com/RustCrypto/formats.git" }
pkcs1      = { git = "https://github.com/RustCrypto/formats.git" }
pkcs5      = { git = "https://github.com/RustCrypto/formats.git" }
spki       = { git = "https://github.com/RustCrypto/formats.git" }
x509-cert  = { git = "https://github.com/RustCrypto/formats.git" }
x509-ocsp  = { git = "https://github.com/RustCrypto/formats.git" }
x509-tsp   = { git = "https://github.com/RustCrypto/formats.git" }

sha1       = { git = "https://github.com/RustCrypto/hashes.git" }
sha2       = { git = "https://github.com/RustCrypto/hashes.git" }

rsa            = { git = "https://github.com/RustCrypto/RSA.git" }
crypto-bigint  = { git = "https://github.com/RustCrypto/crypto-bigint.git" }
elliptic-curve = { git = "https://github.com/RustCrypto/traits.git" }
ecdsa          = { git = "https://github.com/RustCrypto/signatures.git"}

# Miscellaneous repos
authenticode   = {git = "https://github.com/carl-wallace/authenticode-rs.git", branch = "updates"}
